<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Parcours SiLeMIO de la préparation à l'exploitation</title><desc id="desc">Le patch peut être préparé dans StageFlow ou Excel, transféré avec StageDesk, enrichi par les autres outils puis exploité avec StageMark et StageMon.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a8d3"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#f4f8fa}.muted{fill:#a9bac6}.card{fill:#1b2a38;stroke:#354b60;stroke-width:2}.arrow{stroke:#58a8d3;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="620" fill="#101923"/><text x="65" y="64" font-size="36" font-weight="600">De la préparation à l'exploitation</text><text x="65" y="100" class="muted" font-size="20">Chaque étape est facultative et chaque logiciel peut rester autonome.</text>
  <g transform="translate(65 170)"><rect width="230" height="150" rx="16" class="card"/><text x="115" y="48" text-anchor="middle" font-size="24" font-weight="600">StageFlow / Excel</text><text x="115" y="83" text-anchor="middle" class="muted" font-size="18">Commun · groupes</text><text x="115" y="112" text-anchor="middle" class="muted" font-size="18">classeur V3</text></g>
  <path d="M295 245H355" class="arrow"/>
  <g transform="translate(355 170)"><rect width="250" height="150" rx="16" fill="#223445" stroke="#21b6a8" stroke-width="3"/><text x="125" y="48" text-anchor="middle" font-size="26" font-weight="600">StageDesk</text><text x="125" y="83" text-anchor="middle" class="muted" font-size="18">Labels · couleurs</text><text x="125" y="112" text-anchor="middle" class="muted" font-size="18">réglages essentiels</text></g>
  <path d="M605 245H665" class="arrow"/>
  <g transform="translate(665 170)"><rect width="250" height="150" rx="16" class="card"/><text x="125" y="48" text-anchor="middle" font-size="22" font-weight="600">Consoles / logiciels</text><text x="125" y="83" text-anchor="middle" class="muted" font-size="18">Projet neuf ou existant</text><text x="125" y="112" text-anchor="middle" class="muted" font-size="18">scène · snapshot</text></g>
  <path d="M915 245H975" class="arrow"/>
  <g transform="translate(975 140)"><rect width="360" height="210" rx="16" class="card"/><text x="180" y="46" text-anchor="middle" font-size="22" font-weight="600">Autres métiers</text><text x="180" y="84" text-anchor="middle" class="muted" font-size="18">Dante Config Editor · réseau hors ligne</text><text x="180" y="116" text-anchor="middle" class="muted" font-size="18">StageMark · implantation et projection</text><text x="180" y="148" text-anchor="middle" class="muted" font-size="18">StageMon · deux écoutes live</text><text x="180" y="180" text-anchor="middle" class="muted" font-size="18">AutoCAD · plan technique</text></g>
  <rect x="355" y="400" width="560" height="85" rx="42" fill="#173934"/><text x="635" y="437" text-anchor="middle" fill="#62d4c9" font-size="21" font-weight="600">Projet partagé .stageflow facultatif</text><text x="635" y="466" text-anchor="middle" class="muted" font-size="17">Mode manuel ou LIVE · domaines séparés · aucune dépendance obligatoire</text>
  <text x="1335" y="575" text-anchor="end" class="muted" font-size="16">SiLeMI/O by Mamat — ----[]--</text>
